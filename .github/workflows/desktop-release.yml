name: Desktop Distributables

# Builds the distributable Milpa Desktop for Linux + macOS in parallel and publishes the artifacts with a
# combined SHA256SUMS.txt to a public GitHub Release. Fires on a `desktop-v*` tag, or manually.
#
#   git tag desktop-v0.2.0 && git push origin desktop-v0.2.0
#
# This repo is public, so the Release it creates is public — external devs download the artifact for their OS
# and verify it against SHA256SUMS.txt. The binary defaults to the public image ghcr.io/getmilpa/framework:dev
# (pulled on first launch); Docker is the only prerequisite.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write   # create the Release + upload assets

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci || npm install

      - name: Build distributable
        env:
          # No Apple signing cert in CI — ship an unsigned .dmg/.zip (Gatekeeper warns; users right-click → Open).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            npm run dist:mac
          else
            npm run dist
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: milpa-desktop-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Assemble + checksum
        run: |
          mkdir -p out
          find incoming -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.zip' \) -exec cp -n {} out/ \;
          cd out
          sha256sum ./* > SHA256SUMS.txt
          echo "=== release assets ==="; ls -lh; echo "=== SHA256SUMS ==="; cat SHA256SUMS.txt

      - name: Publish to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Milpa Desktop $GITHUB_REF_NAME" \
            --notes "Distributable Milpa Desktop. Download the artifact for your OS and verify it against SHA256SUMS.txt. Requires Docker; the app pulls the public image on first launch." \
            ./* \
          || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./*
